<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24桁バーコードチェッカー</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 10px;
      text-align: center;
      background-color: #f4f5f7;
    }
    h2 { margin: 8px 0; font-size: 1.2rem; }
    #reader {
      max-width: 480px;
      margin: 0 auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    #result-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      font-size: 1.4rem;
      font-weight: bold;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #e2e8f0;
      color: #4a5568;
      word-break: break-all;
    }
    .ok { background-color: #28a745 !important; color: #fff !important; }
    .ng { background-color: #dc3545 !important; color: #fff !important; }
    .details { font-size: 0.85rem; font-weight: normal; margin-top: 6px; }
  </style>
</head>
<body>

  <h2>出荷前 バーコード桁数判定</h2>
  <div id="reader"></div>
  <div id="result-box">
    <div>コードをかざしてください</div>
  </div>

  <script>
    let isProcessing = false;

    function playBeep(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'ok') {
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else {
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch (e) {
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const len = decodedText.length;
      const resBox = document.getElementById('result-box');

      if (len === 24) {
        resBox.className = 'ok';
        resBox.innerHTML = `<div>【OK】24桁</div><div class="details">${decodedText}</div>`;
        playBeep('ok');
      } else {
        resBox.className = 'ng';
        resBox.innerHTML = `<div>【NG】桁数異常：${len}桁</div><div class="details">${decodedText}</div>`;
        playBeep('ng');
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }

      setTimeout(() => { isProcessing = false; }, 1500);
    }

    // 読み取り対象のフォーマットを限定（誤読・部分読み取り防止）
    const formatsToSupport = [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.DATA_MATRIX
    ];

    const scanner = new Html5QrcodeScanner("reader", { 
      fps: 20,
      qrbox: { width: 340, height: 100 }, 
      aspectRatio: 1.333,
      formatsToSupport: formatsToSupport,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true // スマホ内蔵の高速検出エンジンを使用
      },
      rememberLastUsedCamera: true
    });
    scanner.render(onScanSuccess);
  </script>
</body>
</html>
