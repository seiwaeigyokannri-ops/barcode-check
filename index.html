<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24桁バーコードチェッカー</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 10px; text-align: center; background-color: #f4f5f7; }
    h2 { margin: 8px 0; font-size: 1.2rem; }
    #start-btn { font-size: 1.1rem; padding: 12px 28px; border-radius: 8px; border: 0;
      background: #2563eb; color: #fff; margin: 10px; }
    #reader { max-width: 480px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
    #result-box { margin-top: 15px; padding: 15px; border-radius: 12px; font-size: 1.4rem;
      font-weight: bold; min-height: 70px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; background-color: #e2e8f0;
      color: #4a5568; word-break: break-all; }
    .ok { background-color: #28a745 !important; color: #fff !important; }
    .ng { background-color: #dc3545 !important; color: #fff !important; }
    .details { font-size: 0.9rem; font-weight: normal; margin-top: 6px;
      font-family: monospace; }
    .fmt { font-size: 0.8rem; font-weight: normal; margin-top: 4px; opacity: 0.9; }
  </style>
</head>
<body>
  <h2>出荷前 バーコード桁数判定</h2>
  <button id="start-btn">スキャン開始</button>
  <div id="reader"></div>
  <div id="result-box"><div>コードをかざしてください</div></div>

  <script>
    // ===== 設定 =====
    const TARGET_LENGTH = 24;   // 正しい桁数（スペース・記号も1文字として数える）
    const CONFIRM_COUNT = 3;    // 同じ値を連続何回読めたら確定するか
    const RESET_MS = 1000;      // これ以上間が空いたらカウントをリセット
    const FORMATS = [           // 一次元のみ
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.CODABAR
    ];
    // ================

    let audioCtx = null;
    let isProcessing = false;
    let lastText = null;
    let lastTime = 0;
    let sameCount = 0;

    function playBeep(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const ok = type === 'ok';
      osc.frequency.value = ok ? 880 : 220;
      gain.gain.value = ok ? 0.2 : 0.3;
      osc.start();
      osc.stop(audioCtx.currentTime + (ok ? 0.15 : 0.4));
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // スペースを ␣ で見えるようにする
    function visible(s) {
      return escapeHtml(s).replace(/ /g, '␣');
    }

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;

      // 注意：trim()はしない（スペースも桁として数えるため）
      const text = decodedText;
      const now = Date.now();

      // 同じ値を連続で読めたときだけ確定（部分読み取り対策）
      if (text === lastText && now - lastTime < RESET_MS) {
        sameCount++;
      } else {
        lastText = text;
        sameCount = 1;
      }
      lastTime = now;
      if (sameCount < CONFIRM_COUNT) return;

      isProcessing = true;
      sameCount = 0;
      lastText = null;

      const len = text.length;
      const fmt = (decodedResult && decodedResult.result && decodedResult.result.format)
        ? decodedResult.result.format.formatName : '不明';
      const resBox = document.getElementById('result-box');

      if (len === TARGET_LENGTH) {
        resBox.className = 'ok';
        resBox.innerHTML = `<div>【OK】${TARGET_LENGTH}桁</div>
          <div class="details">${visible(text)}</div>
          <div class="fmt">種類：${escapeHtml(fmt)}</div>`;
        playBeep('ok');
      } else {
        resBox.className = 'ng';
        resBox.innerHTML = `<div>【NG】桁数異常：${len}桁</div>
          <div class="details">${visible(text)}</div>
          <div class="fmt">種類：${escapeHtml(fmt)}</div>`;
        playBeep('ng');
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
      setTimeout(() => { isProcessing = false; }, 1500);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
      document.getElementById('start-btn').style.display = 'none';

      const scanner = new Html5QrcodeScanner("reader", {
        fps: 20,
        qrbox: { width: 340, height: 100 },
        aspectRatio: 1.333,
        formatsToSupport: FORMATS,
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        rememberLastUsedCamera: true
      });
      scanner.render(onScanSuccess);
    });
  </script>
</body>
</html>
